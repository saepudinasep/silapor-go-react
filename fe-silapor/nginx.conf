server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Kompresi dasar untuk asset statis
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Semua route diarahkan ke index.html supaya React Router (client-side routing) berfungsi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset statis hasil build Vite (punya hash di nama file, aman di-cache lama)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
